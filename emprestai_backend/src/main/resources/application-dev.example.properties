# Copie este arquivo para application-dev.properties e altere os valores locais.
# O arquivo application-dev.properties é ignorado pelo Git e nunca deve conter segredos de produção.

# Chave HS256 local: precisa ter pelo menos 32 caracteres.
jwt.secret=troque-esta-chave-local-por-uma-com-32-caracteres

# Chave exigida uma única vez para criar o primeiro ADM_SUPREMO.
initial-setup.key=troque-esta-chave-de-instalacao-local

# Cookies sem HTTPS são aceitos apenas no desenvolvimento local.
auth.cookie.secure=false
auth.cookie.same-site=Lax
auth.cors.allowed-origins=http://localhost:5173
