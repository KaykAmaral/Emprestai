spring.application.name=emprestai

# Conexao com o MySQL local
# createDatabaseIfNotExist=true cria o banco automaticamente se ele nao existir ainda
spring.datasource.url=jdbc:mysql://localhost:3306/emprestai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
# update: cria/atualiza as tabelas automaticamente a partir das entidades (bom pra dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect