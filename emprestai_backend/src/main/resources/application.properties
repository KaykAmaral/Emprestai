spring.application.name=emprestai

# Conexao com o MySQL local
# createDatabaseIfNotExist=true cria o banco automaticamente se ele nao existir ainda
spring.datasource.url=jdbc:mysql://localhost:3306/emprestai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
# update: cria/atualiza as tabelas automaticamente a partir das entidades (bom pra dev).
# Atenção: colunas NOT NULL em tabela com dados podem não ser aplicadas pelo update; nesse caso,
# adicione a coluna manualmente via ALTER TABLE (ex.: criado_em).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Segredos de produção são fornecidos por variáveis de ambiente. Para desenvolvimento,
# ative o perfil `dev` e use o arquivo local application-dev.properties (ignorado pelo Git).
jwt.secret=${JWT_SECRET:}
jwt.expiration=PT1H

auth.cookie.name=AUTH_TOKEN
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

initial-setup.key=${INITIAL_SETUP_KEY:}
