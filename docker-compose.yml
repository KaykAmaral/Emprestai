version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: emprestai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: emprestai_db
      MYSQL_USER: proati_user
      MYSQL_PASSWORD: proati_pass
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - emprestai_network

  backend:
    build:
      context: ./emprestai_backend
      dockerfile: Dockerfile
    container_name: emprestai_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/emprestai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-sua_chave_secreta_jwt_aqui_min_32_caracteres}
      INITIAL_SETUP_KEY: ${INITIAL_SETUP_KEY:-chave_setup_inicial}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - emprestai_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  emprestai_network:
    driver: bridge
